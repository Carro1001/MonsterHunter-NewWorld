org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Platform pins - see docs/REVIVAL_HANDOFF.md section 7.3.
## Do not float these to "latest"; every value below is a deliberate, sourced pin.
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
loader_version_range=[1,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Dependencies
geckolib_version=4.9.2
geckolib_version_range=[4.9.2,)
# R1a: the one new dependency. Compatible Overworld biome placement -- registering a biome JSON
# does not make it generate, and the alternative is our own biome-source mixin or overwriting the
# world's global noise settings. The Maven version carries the "1.21.1-" prefix; the runtime mod
# version does not, hence the two values.
terrablender_version=4.1.0.8
terrablender_version_range=[4.1.0.8,4.2)

## Mod Properties
mod_id=mhnw
mod_name=Monster Hunter: New World
# Settled (R0a, roadmap v4 Q25): the maintainer states GPL-3.0 is the intended
# license, matching the repository root LICENSE. The old "All Rights Reserved"
# placeholder here was the unresolved half of that conflict, not a separate
# choice. This aligns the packaged metadata only -- it says nothing about
# third-party branding/sound rights, which remain unresolved.
mod_license=GPL-3.0
mod_version=0.2.0
mod_group_id=com.carro1001.mhnw
