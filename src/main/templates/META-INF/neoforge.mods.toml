modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/Carro1001/MonsterHunter-NewWorld/issues"

[[mods]]
# Read from the per-mod config, NOT the file root: FML looks this up through
# IModInfo.getConfig().getConfigElement("enumExtensions"). At the top of the file it is silently
# ignored -- no warning, no error, and the first symptom is a rendering crash the moment something
# asks the proxy for its value. See docs/WEAPON_POSING.md section 5.
enumExtensions = "META-INF/enumextensions.json"
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/Carro1001/MonsterHunter-NewWorld"
logoFile = "logo.png"
authors = "Carro1001, AlexVR, Spinomania, Spooky_Indominus"
credits = '''
Capcom, and the amazing artists that did the models for this mod.
MultiHitBoxLib's authors: DerToaster, Meme Man, and AzureDoom.
CorgiTaco('Ur mom') as a arms for hire.
SmartBrainLib's authors: Tslat, AzureDoom, and OmbreMoon.
'''
description = '''
A Monster Hunter themed mod for Minecraft.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "geckolib"
type = "required"
versionRange = "${geckolib_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "terrablender"
type = "required"
versionRange = "${terrablender_version_range}"
ordering = "NONE"
side = "BOTH"
